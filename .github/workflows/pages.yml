# Publishes the GuRu web app (web/) to GitHub Pages so it can be added to an iPhone home screen.
# Needs Pages turned on: Settings > Pages > Source: GitHub Actions (public repo, or a paid GitHub plan for private).
name: Publish iPhone web app

on:
  workflow_dispatch:
  push:
    paths: ['web/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

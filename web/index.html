<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GuRu">
<meta name="theme-color" content="#07081a">

<title>GuRu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, cinematic coach – a living-room TV app at night
   IDEA: an Apple-TV style home screen: shelves of poster cards under a turning galaxy
   PICTURE: the meditating-man-and-Milky-Way mark; the working planner/player is the main picture
   COLOUR+TYPE: night navy fields, warm core-gold glow, aurora blue accent; Manrope throughout
   LAYOUT: top bar with logo, one view per tab, floating glass tab bar, full-screen sheets */
:root{color-scheme:dark;--bg:#07081a;--bg2:#0f1230;--ink:#f7f8ff;--dim:#d3d7f0;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--line:rgba(255,255,255,.14);--blue:#7c9cff;--gold:#ffc876;--mint:#5ce1c6;--ember:#ff8a5c;--rose:#ff6b8b;--r:20px}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:radial-gradient(120% 70% at 50% -10%,#1d2156 0%,var(--bg2) 35%,var(--bg) 75%) fixed;color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;min-height:100vh;-webkit-tap-highlight-color:transparent}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:12px}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 16px 120px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1100px;margin:0 auto;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:linear-gradient(rgba(7,8,26,.85),rgba(7,8,26,.4))}
header svg{width:46px;height:46px;flex:none}
header h1{margin:0;font-size:26px;line-height:1;letter-spacing:-.02em;font-weight:800}
header small{color:var(--dim);font-size:13px}
.sync{margin-left:auto;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim)}.sync.ok i{background:var(--mint)}
nav.tabs{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;display:flex;gap:2px;padding:5px;border-radius:32px;background:rgba(18,20,48,.82);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.5);width:min(560px,calc(100% - 16px))}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:24px;color:var(--dim);text-decoration:none;font-size:12px;font-weight:600;transition:background .25s,color .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
nav.tabs a.on{background:rgba(124,156,255,.22);color:#fff;transform:scale(1.06)}
nav.tabs svg{width:22px;height:22px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h2{font-size:22px;margin:22px 0 4px;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:14px;margin:0 0 10px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:var(--r);transition:transform .35s cubic-bezier(.3,1.5,.5,1),background .2s}
.tap:active{transform:scale(.965)}
.hi{background:linear-gradient(140deg,rgba(124,156,255,.28),rgba(255,200,118,.10))}
.pad{padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;font-weight:700;background:linear-gradient(135deg,#7c9cff,#5fc3ff);color:#06081a;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.btn:active{transform:scale(.94)}
.btn.ghost{background:var(--glass2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--line)}
.chip{min-height:38px;padding:0 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s}
.chip.on{background:var(--blue);color:#06081a;border-color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips>*{flex:none}
.shelf{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;scrollbar-width:none}.shelf::-webkit-scrollbar{display:none}
.shelf>*{scroll-snap-align:start;flex:none}
.poster{width:168px;overflow:hidden;text-align:left}
.poster .art{height:96px;display:grid;place-items:center;position:relative}
.poster .art svg{width:38px;height:38px;stroke:#fff;opacity:.95}
.poster .art span{position:absolute;right:10px;bottom:8px;font-size:12px;font-weight:700;color:#fff}
.poster b{display:block;font-size:15px;line-height:1.25;margin:10px 12px 2px}
.poster small{display:block;color:var(--dim);font-size:13px;margin:0 12px 12px}
.hero{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 12%;scrollbar-width:none}.hero::-webkit-scrollbar{display:none}
.hcard{flex:none;width:min(420px,76vw);height:220px;border-radius:28px;scroll-snap-align:center;position:relative;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;color:#fff;box-shadow:0 18px 50px rgba(0,0,0,.45);transition:transform .25s ease-out,opacity .25s}
.hcard .big{position:absolute;right:-10px;top:-10px;width:150px;height:150px;stroke:#fff;opacity:.22}
.hcard em{font-style:normal;font-size:12px;font-weight:700;opacity:.85}
.hcard b{font-size:clamp(22px,4vw,30px);line-height:1.1;letter-spacing:-.02em}
.heronav{display:flex;justify-content:center;gap:10px;margin-top:4px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:12px;color:var(--dim);font-weight:700}
.day{aspect-ratio:1;border-radius:14px;background:var(--glass);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:15px;transition:background .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.day.out{opacity:.35}.day.today{box-shadow:inset 0 0 0 2px var(--gold)}.day.sel{background:var(--blue);color:#06081a;transform:scale(1.06)}
.dots{display:flex;gap:3px;height:6px}.dots i{width:6px;height:6px;border-radius:50%}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 10px}
.cal-head b{font-size:20px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:10px}
.item .t{flex:1}
.item b{display:block;line-height:1.3}
.item small{color:var(--dim);font-size:13px;display:block}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.check.on{background:var(--mint);border-color:transparent;color:#06081a}
.time{font-size:26px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.sw{width:52px;height:32px;border-radius:99px;background:var(--glass2);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.sw.on{background:var(--mint)}.sw.on::after{transform:translateX(20px)}
.empty{color:var(--dim);font-size:14px;padding:8px 2px 14px}
.fab{position:fixed;right:max(16px,calc(50% - 534px));bottom:96px;z-index:4;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(3,4,14,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-end;animation:fade .25s}
.panel{width:min(760px,100%);max-height:94vh;overflow:auto;background:linear-gradient(180deg,#151a44,#0a0c22);border:1px solid var(--line);border-radius:28px 28px 0 0;animation:rise .45s cubic-bezier(.2,1.1,.3,1)}
.panel .top{height:210px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;overflow:hidden}
.panel .top::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,#151a44)}
.panel .top>*{position:relative;z-index:1}
.panel .top .big{position:absolute;right:-20px;top:-20px;width:190px;height:190px;stroke:#fff;opacity:.2;z-index:0}
.panel .top h3{margin:0;font-size:clamp(26px,5vw,36px);line-height:1.08;letter-spacing:-.02em}
.panel .close{position:absolute;top:14px;right:14px;z-index:2}
.panel .body{padding:4px 20px 28px}
@keyframes rise{from{transform:translateY(60px);opacity:0}}@keyframes fade{from{opacity:0}}
details.move{margin-bottom:10px}
details.move summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer}
details.move summary::-webkit-details-marker{display:none}
details.move[open]{background:linear-gradient(140deg,rgba(124,156,255,.22),rgba(255,255,255,.04))}
.num{width:28px;height:28px;border-radius:50%;background:var(--glass2);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.guide{padding:0 16px 16px}
.guide ol{margin:8px 0;padding:0;list-style:none;counter-reset:s}
.guide li{counter-increment:s;display:flex;gap:10px;margin:8px 0}
.guide li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#7c9cff,#5fc3ff);color:#06081a;font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.cue{color:var(--mint)}.avoid{color:var(--ember)}
a.link{color:var(--blue);font-weight:700;text-decoration:none;display:inline-flex;gap:6px;align-items:center;min-height:44px}
label.f{display:block;font-size:13px;color:var(--dim);font-weight:600;margin:12px 0 6px}
input.in,textarea.in,select.in{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:16px}
textarea.in{min-height:110px;resize:vertical}
.daypick{display:flex;gap:6px}.daypick button{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-weight:700}.daypick button.on{background:var(--blue);color:#06081a}
#player{position:fixed;inset:0;z-index:20;background:radial-gradient(90% 60% at 50% 0%,#1d2156,#07081a);overflow:auto;animation:fade .3s}
#player .in{max-width:640px;margin:0 auto;padding:20px 20px 40px;text-align:center}
.segs{display:flex;gap:4px;margin:12px 0 18px}.segs i{flex:1;height:4px;border-radius:4px;background:var(--glass2);transition:background .4s}.segs i.on{background:var(--blue)}
.ring{position:relative;width:min(240px,64vw);aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .fg{stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.ring div{position:absolute;inset:0;display:grid;place-content:center}
.ring b{font-size:clamp(44px,12vw,60px);line-height:1;font-variant-numeric:tabular-nums}
.ring small{letter-spacing:.2em;font-weight:700;font-size:13px}
.ctrls{display:flex;justify-content:center;align-items:center;gap:16px;margin:22px 0 10px}
.ctrls .iconbtn{width:56px;height:56px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.macros b{display:block;font-size:clamp(18px,4.5vw,24px);line-height:1.15;white-space:nowrap}.macros small{color:var(--dim);font-size:13px}
.mbar{display:flex;height:8px;border-radius:8px;overflow:hidden;gap:2px}.mbar span{display:block}
.stat{padding:14px}.stat b{display:block;font-size:clamp(22px,5vw,30px);line-height:1.1}.stat small{color:var(--dim);font-size:13px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:150px;padding:14px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--dim)}
.bars span{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(var(--gold),var(--ember));min-height:4px;transition:height .6s cubic-bezier(.2,1,.3,1)}
/* water bottle */
.waterbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.bottle{width:clamp(110px,30vw,150px);height:auto;display:block;overflow:visible}
.bottle .lvl{transition:transform 1.1s cubic-bezier(.2,1,.3,1)}
.bottle .wave{animation:wave 3.2s linear infinite}.bottle .wave2{animation:wave 4.6s linear infinite reverse;opacity:.55}
@keyframes wave{to{transform:translateX(-120px)}}
.bottle .bub{animation:bub 3.5s ease-in infinite;opacity:0}@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:.7}100%{transform:translateY(-120px);opacity:0}}
.wpct{font-size:clamp(40px,11vw,58px);font-weight:800;line-height:1;letter-spacing:-.03em}
.done-glow{filter:drop-shadow(0 0 14px rgba(92,225,198,.8))}
canvas.demo{width:100%;aspect-ratio:16/10;display:block;border-radius:16px;background:radial-gradient(120% 90% at 50% 15%,#1f2660,#0b0e29);margin:6px 0 12px}
.demo-sm{aspect-ratio:16/11;margin:0 0 8px}
.moon{font-size:clamp(44px,12vw,64px);font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stars5{display:flex;gap:6px}.stars5 button{width:44px;height:44px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-weight:800}.stars5 button.on{background:var(--gold);color:#06081a}
.tip{display:flex;gap:12px;padding:12px 14px;margin-bottom:10px}.tip .ic{margin-top:2px;color:var(--gold)}
ul.clean{margin:6px 0 0;padding-left:18px}ul.clean li{margin:4px 0}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-140%);z-index:30;width:min(460px,calc(100% - 24px));transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
#toast.show{transform:translate(-50%,0)}
#snack{position:fixed;left:50%;bottom:160px;transform:translate(-50%,30px);opacity:0;z-index:30;background:#22285e;border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:.35s;pointer-events:none;white-space:nowrap}
#snack.show{opacity:1;transform:translate(-50%,0)}
.view{animation:viewin .45s cubic-bezier(.2,1,.3,1)}
@keyframes viewin{from{opacity:0;transform:translateY(14px)}}
.gx{transform-origin:54px 47px;animation:spin 120s linear infinite}
.halo{transform-origin:54px 44.6px;animation:breathe 4s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{from{transform:scale(.86);opacity:.8}}
@media(max-width:720px){.split{grid-template-columns:minmax(0,1fr)}.hero{padding:8px 8%}header h1{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* installed iPhone app: keep clear of the notch and home indicator */
header{padding-top:calc(12px + env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
nav.tabs{bottom:calc(10px + env(safe-area-inset-bottom))}
.fab{bottom:calc(96px + env(safe-area-inset-bottom))}
#player .in{padding-top:calc(20px + env(safe-area-inset-top))}
</style>
</head>

  requestAnimationFrame(loop);

})();

const toMin = s => { const [h, m] = (s || '0:0').split(':').map(Number); return h * 60 + m; };
const fromMin = m => { m = ((m % 1440) + 1440) % 1440; return fmtT(m / 60 | 0, m % 60); };
const hm = m => m < 60 ? `${Math.round(m)} min` : `${m / 60 | 0}h ${pad(Math.round(m % 60))}m`;
const fdate = d => { const x = parse(d); return `${DN[(x.getDay() + 6) % 7]}, ${MONTHS[x.getMonth()].slice(0, 3)} ${x.getDate()}`; };
const slDur = e => { let d = toMin(e.wake) - toMin(e.bed); if (d <= 0) d += 1440; return d; };
const FACTORS = [['caffeine','Caffeine after 2 PM'],['alcohol','Alcohol'],['lateMeal','Late or heavy meal'],['screens','Screens in bed'],['stress','Stressed'],['nap','Napped'],['pain','Pain or discomfort']];
const sleepNights = n => Object.keys(S.sleep || {}).sort().slice(-n).map(d => ({ d, ...S.sleep[d] }));
const bedTarget = () => toMin(S.sleepGoal.wake) - S.sleepGoal.hours * 60 - 15;
const workedOut = d => S.sched.some(w => w.day === addDays(d, -1) && w.done);
function sleepInsights() {
  const N = sleepNights(14), out = []; if (N.length < 3) return out;
  const goal = S.sleepGoal.hours * 60, avg = N.reduce((a, e) => a + slDur(e), 0) / N.length;
  if (avg < goal - 30) out.push(['warn', `You're averaging ${hm(avg)} a night, about ${hm(goal - avg)} short of your ${S.sleepGoal.hours}-hour goal. Try moving bedtime 15 minutes earlier each week until you're there.`]);
  else out.push(['good', `You're averaging ${hm(avg)} a night, right around your ${S.sleepGoal.hours}-hour goal. Nice.`]);
  const beds = N.map(e => { const m = toMin(e.bed); return m < 720 ? m + 1440 : m; }), mb = beds.reduce((a, b) => a + b, 0) / beds.length;
  const sd = Math.sqrt(beds.reduce((a, b) => a + (b - mb) ** 2, 0) / beds.length);
  if (sd > 50) out.push(['warn', `Your bedtime swings by about ${hm(sd)} from night to night. A steady bedtime, even on weekends, is one of the strongest habits for better sleep.`]);
  const q = arr => arr.reduce((a, e) => a + (+e.q || 0), 0) / arr.length;
  for (const [k, label] of FACTORS) { const yes = N.filter(e => e.f && e.f[k]), no = N.filter(e => !(e.f && e.f[k]));
    if (yes.length >= 2 && no.length >= 2 && q(no) - q(yes) >= 0.6) out.push(['warn', `On nights with "${label.toLowerCase()}", your sleep quality averages ${q(yes).toFixed(1)} vs ${q(no).toFixed(1)} without it.`]); }
  const wo = N.filter(e => workedOut(e.d)), nwo = N.filter(e => !workedOut(e.d));
  if (wo.length >= 2 && nwo.length >= 2 && q(wo) - q(nwo) >= 0.5) out.push(['good', `You sleep better after workout days (${q(wo).toFixed(1)} vs ${q(nwo).toFixed(1)}). Keep training, ideally finishing hard sessions 2+ hours before bed.`]);
  const wk = N.reduce((a, e) => a + (+e.wakeups || 0), 0) / N.length;
  if (wk >= 2) out.push(['warn', `You're waking about ${wk.toFixed(1)} times a night. Cut fluids 1-2 hours before bed, keep the room cool and dark, and limit alcohol.`]);

const beep = (f = 880) => { try { actx ||= new AudioContext(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; g.gain.setValueAtTime(.15, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .35); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .35); } catch {} try { navigator.vibrate?.(180); } catch {} };
function tick() {
  if (!PL || PL.paused) return;
  PL.left--; if (PL.left <= 3 && PL.left > 0) beep(660);
  if (PL.left <= 0) { beep(990);
    if (!PL.rest && PL.i < PL.moves.length - 1) PL.rest = true;
    else if (PL.rest) { PL.rest = false; PL.i++; }
    else return finishPlayer();
    setPhase(); drawPlayer(); return; }
  updateRing();
}
setInterval(tick, 1000);
function finishPlayer() { const f = PL.onFinish; closePlayer(); f && f(); snack(`Workout complete. Nice work!`); }
function closePlayer() { PL = null; $('#player').hidden = true; $('#player').innerHTML = ''; document.body.style.overflow = ''; render(); }
const C = 2 * Math.PI * 54;
function updateRing() { const fg = $('#ringfg'); if (!fg) return; fg.style.strokeDashoffset = C * (1 - PL.left / PL.total); $('#ringt').textContent = `${PL.left / 60 | 0}:${pad(PL.left % 60)}`; }
function drawPlayer() {
  const p = PL, line = p.moves[p.i];
  $('#player').innerHTML = `<div class="in">
    <div class="row" style="justify-content:space-between;text-align:left"><div><b style="font-size:20px">${esc(p.title)}</b><br><small style="color:var(--dim)">Move ${p.i + 1} of ${p.moves.length}</small></div>
      <button class="iconbtn" data-act="closeP" aria-label="Close">${I('x')}</button></div>
    <div class="segs">${p.moves.map((_, i) => `<i class="${i <= p.i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" stroke="rgba(255,255,255,.12)"/><circle id="ringfg" class="fg" cx="60" cy="60" r="54" stroke="${p.rest ? 'var(--mint)' : 'var(--blue)'}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p.left / p.total)}"/></svg>
      <div><b id="ringt">${p.left / 60 | 0}:${pad(p.left % 60)}</b><small style="color:${p.rest ? 'var(--mint)' : 'var(--blue)'}">${p.rest ? 'REST' : 'WORK'}</small></div></div>
    <div class="ctrls"><button class="iconbtn" data-act="pPrev" aria-label="Previous">${I('prev')}</button>
      <button class="btn" data-act="pToggle" style="min-width:140px;justify-content:center">${I(p.paused ? 'play' : 'pause')} ${p.paused ? 'Start' : 'Pause'}</button>
      <button class="iconbtn" data-act="pNext" aria-label="Next">${I('next')}</button></div>
    <div class="chips" style="justify-content:center">${[30, 45, 60].map(s => `<button class="chip ${p.work === s ? 'on' : ''}" data-act="pWork" data-n="${s}">${s}s work</button>`).join('')}</div>
    <div class="view" style="text-align:left;margin-top:14px">${p.rest ? `<h2 style="text-align:center">Breathe. Next up:</h2><p style="text-align:center;font-size:22px;font-weight:700">${esc(p.moves[p.i + 1])}</p>`
      : `<h2 style="text-align:center;font-size:clamp(24px,6vw,32px)">${esc(line)}</h2><div class="card">${guideHTML(line)}</div>`}</div></div>`;
  DEMO.mount($('#player'));
}

// ---------- render ----------

  if (same) scrollTo(0, y); else scrollTo(0, 0);
  render.last = tab; heroFx(); DEMO.mount($('#view'));
}
function heroFx() { const h = $('#hero'); if (!h) return;
  const fx = () => { const c = h.getBoundingClientRect(), mid = c.left + c.width / 2;
    h.querySelectorAll('.hcard').forEach(el => { const r = el.getBoundingClientRect(); const f = Math.max(0, 1 - Math.abs(r.left + r.width / 2 - mid) / c.width);
      el.style.transform = `scale(${.86 + .14 * f})`; el.style.opacity = .5 + .5 * f; }); };
  h.addEventListener('scroll', () => requestAnimationFrame(fx), { passive: true }); fx(); }
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) { tab = h; closeSheet(); render(); } });

    for (let i = 0; i < 7; i++) { const day = addDays(sel, i); S.plan = S.plan.filter(p => !(p.day === day && p.slot === 'Dinner')); S.plan.push({ id: uid(), mid: pool[i % pool.length].id, day, slot: 'Dinner' }); }
    save(); render(); snack('7 dinners planned'); },
  shop: () => sheetShop(),

  saveIdea: d => { const r = ideas[+d.i]; S.meals.push({ id: uid(), name: r.name, kind: r.kind === 'Smoothie' ? 'Smoothie' : 'Dinner', prep: PREPS.includes(r.prep) ? r.prep : 'One Pot',

  quick: d => { const q = QUICK[+d.i]; sheetRem({ id: '', title: q[0], type: q[1], h: q[2], m: q[3], days: q[4], note: '' }); },
  editR: d => sheetRem(d.id ? R(d.id) : null),

  delR: d => { S.rem = S.rem.filter(r => r.id !== d.id); save(); closeSheet(); render(); },
  logSleep: () => sheetSleep(),
  slq: (d, el) => { const box = el.parentElement; box.dataset.v = d.n; box.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.n <= +d.n)); },
  slf: (d, el) => el.classList.toggle('on'),
  delSleep: d => { delete S.sleep[d.d]; save(); closeSheet(); render(); },
  sleepAlerts: () => { const b = bedTarget(), add = (title, m, note) => { if (!S.rem.some(r => r.title === title)) S.rem.push({ id: uid(), title, type: 'Other', h: ((m % 1440) + 1440) % 1440 / 60 | 0, m: ((m % 1440) + 1440) % 1440 % 60, days: 127, note, on: true }); };
    add('Start winding down', b - 45, 'Dim lights, phone away, wind-down stretch'); add('Last call for caffeine', b - 480, 'Switch to water or herbal tea'); save(); render(); snack('Sleep alerts added'); },
  myairShot: () => $('#myairFile').click(),

  water: d => { const t = TODAY(), before = S.water[t] || 0, g = waterGoal(); S.water[t] = before + +d.n; S.waterLast = { d: t, n: +d.n }; save(); render();

  close: closeSheet, closeBg: (d, el, e) => { if (e.target === el) closeSheet(); },

};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = A[el.dataset.act]; if (!f) return;
  if (el.tagName === 'BUTTON' && el.type !== 'submit') e.preventDefault(); f(el.dataset, el, e); });

  if (f.id === 'schedForm') { const t = T(f.dataset.id), start = $('#sStart').value || sel, mask = getMask('sDays'), weeks = Math.min(52, Math.max(1, +$('#sWeeks').value || 1));

    for (let i = 0; i < weeks * 7; i++) { const day = addDays(start, i); if (dowBit(day) & mask) S.sched.push({ id: uid(), tid: t.id, title: t.name, cat: t.cat, day, t: h * 60 + m, min: t.min, ex: t.ex, met: t.met, lvl: t.lvl, done: false }); }
    if ($('#sAlert').checked) { const a = (h * 60 + m - 15 + 1440) % 1440; S.rem.push({ id: uid(), title: `${t.name} in 15 min`, type: 'Workout', h: a / 60 | 0, m: a % 60, days: mask, note: lines(t.ex)[0] || '', on: true }); }

  if (f.id === 'wForm') { const o = { name: $('#wName').value.trim(), cat: $('#wCat').value, lvl: $('#wLvl').value, min: +$('#wMin').value || 30, ex: $('#wEx').value.trim() };
    if (f.dataset.id) Object.assign(T(f.dataset.id), o); else S.templates.push({ id: uid(), ...o, met: MET_DEF[o.lvl], mine: true }); save(); closeSheet(); render(); snack('Workout saved'); }

    if (f.dataset.id) Object.assign(M(f.dataset.id), o); else S.meals.push({ id: uid(), ...o, mine: true }); save(); closeSheet(); render(); snack('Recipe saved'); }

    S.profile = { name: $('#pName').value.trim(), age: Math.min(110, Math.max(13, +$('#pAge').value || 0)) || null, hIn: ft * 12 + inch || null,
      sex: $('#pSex').value, act: $('#pAct').value, goal: $('#pGoal').value, showBmi: $('#pBmi').checked };

  if (f.id === 'goalForm') { S.sleepGoal = { wake: $('#gWake').value || '06:30', hours: Math.min(11, Math.max(5, +$('#gHours').value || 8)) }; save(); render(); snack('Sleep goal updated'); }

    S.sleep[d] = { bed: $('#slBed').value || '23:00', wake: $('#slWake').value || '07:00', q: +$('#slQ').dataset.v || 3, wakeups: +$('#slWk').value || 0, f: fl,
      cpap: { hrs: num('#cpHrs'), ahi: num('#cpAhi'), maskOn: num('#cpOff'), score: num('#cpScore'), seal: $('#cpSeal').value }, notes: $('#slNotes').value.trim() };
    save(); closeSheet(); render(); snack(`Logged ${hm(slDur(S.sleep[d]))}`); }
  if (f.id === 'askform' && sample && !ideasBusy) { const want = $('#ask').value.trim() || 'quick high-protein dinners';
    ideasBusy = true; render();
    try { const res = await sample.json(`You are GuRu, a friendly healthy-eating coach. Suggest 3 easy, healthy home recipes for this request: "${want}". Keep prep simple.${targets() ? ` The person's daily target is about ${targets().kcal} kcal and ${targets().protein}g protein (goal: ${(GOALS.find(g => g[0] === prof().goal) || GOALS[2])[1]}), so aim for dinners near ${targets().dinner} kcal per serving and smoothies near ${targets().shake} kcal.` : ''}
Reply with JSON only: {"recipes":[{"name":string,"kind":"Dinner" or "Smoothie","prep":one of ${JSON.stringify(PREPS)},"min":number of minutes,"tags":"comma,separated","serv":servings,"kcal":kcal per serving,"p":protein g per serving,"c":carbs g per serving,"f":fat g per serving,"ing":[ingredient strings with amounts],"steps":[short step strings]}]}`);
      ideas = (res && res.recipes || []).slice(0, 4); if (!ideas.length) snack('No ideas came back. Try again.'); }
    catch (err) { snack(err && err.code === 'rate_limited' ? 'Busy. Try again in a minute.' : 'Could not get ideas right now'); }

});
document.addEventListener('change', async e => {
  const c = e.target.closest('[data-chk]'); if (c) { const t = TODAY(); S.sleepChk ||= {}; S.sleepChk = { [t]: { ...(S.sleepChk[t] || {}), [c.dataset.chk]: c.checked } }; save(); return; }
  if (e.target.id === 'myairFile' && e.target.files[0] && sample) { snack('Reading your myAir screenshot…');

{"date":"YYYY-MM-DD or empty if not shown","hrs":usage hours as a decimal number (e.g. 7h 24m = 7.4),"seal":"good" or "adjust" (good if the mask seal looks good / high score),"ahi":events per hour as number,"maskOn":mask on/off count as number,"score":myAir score 0-100}. Use null for anything not visible. Do not guess.`, { images: [e.target.files[0]] });

addEventListener('keydown', e => { if (e.key === 'Escape') { if (PL) closePlayer(); else closeSheet(); }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && $('#hero') && !$('#sheet').innerHTML && !PL && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) A.hero({ n: e.key === 'ArrowRight' ? 1 : -1 }); });

// ---------- alerts while open ----------
const askNotify = () => { try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {}); } catch {} };
function checkAlerts() { const now = new Date(), t = TODAY(), hm = now.getHours() * 60 + now.getMinutes();
  for (const r of S.rem) { if (!r.on) continue;
    const due = (r.days & dowBit(t)) && r.h * 60 + r.m === hm && S.fired[r.id] !== t + hm;
    const snoozed = r.snooze && Date.now() >= r.snooze;
    if (due || snoozed) { if (snoozed) delete r.snooze; S.fired[r.id] = t + hm; save(); fire(r); } } }
function fire(r) { beep(880); setTimeout(() => beep(1175), 250);
  $('#toast').innerHTML = `<div class="card hi pad" style="background:#1b2160;box-shadow:0 18px 50px rgba(0,0,0,.6)"><div class="row"><span style="color:var(--gold)">${I(RICON[r.type] || 'alerts')}</span>
    <div style="flex:1"><b>${esc(r.title)}</b><br><small style="color:var(--dim)">${esc(r.note || r.type)}</small></div></div>
    <div class="row" style="margin-top:10px"><button class="btn sm" data-act="tDone">${I('check')} Done</button><button class="btn sm ghost" data-act="tSnooze" data-id="${r.id}">Snooze 10 min</button></div></div>`;
  $('#toast').classList.add('show');
  try { if (Notification.permission === 'granted') new Notification('GuRu: ' + r.title, { body: r.note || r.type }); } catch {} }
setInterval(checkAlerts, 15000); checkAlerts();

// ---------- star field ----------
{ const c = $('#stars'), x = c.getContext('2d'); const st = [...Array(110)].map(() => [Math.random(), Math.random(), Math.random() * 6.28, .6 + Math.random() * 1.2]);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const size = () => { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; }; size(); addEventListener('resize', size);
  const draw = tm => { x.clearRect(0, 0, c.width, c.height);
    for (const [a, b, p, r] of st) { x.globalAlpha = .15 + .4 * (.5 + .5 * Math.sin(tm / 1400 + p)); x.fillStyle = '#fff'; x.beginPath(); x.arc(a * c.width, b * c.height, r * devicePixelRatio, 0, 6.28); x.fill(); }
    if (!still) requestAnimationFrame(draw); };
  requestAnimationFrame(draw); }

render();

(async () => {
  try { const db = await claude.use('db'), user = await claude.use('user'); if (!db || !user) return;
    const id = await user.id(); const ref = db.collection('data/users/' + id).doc('guru');

    if (data && data.json) { const remote = JSON.parse(data.json); if ((remote.updated || 0) > (S.updated || 0)) { S = remote; migrate(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} if (!PL) render(); } }
    dbRef = ref; setSync(true); if (!data || !data.json || (S.updated || 0) > (data.updated || 0)) save();
  } catch { setSync(false); }
})();
(async () => { try { const s = await claude.use('sample'); if (s) { sample = s; try { const lim = await s.limits(); sampleImg = !!(lim && lim.images); } catch {} } if (sample && (tab === 'eat' || tab === 'sleep') && !$('#sheet').innerHTML) render(); } catch {} })();
}
